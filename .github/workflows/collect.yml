name: collect

# 새 글을 분류해 승인 시트로 보낸다. 시트가 중복을 거르고 이미 있는 글은 다시 분류하지 않으므로 여러 번 돌아도 새 글만 추가된다.
# 매주 월 06:00 KST(일 21:00 UTC). 수집 기간이 14일이라 한 주 실행이 실패해도(공공데이터포털이 가끔 해외 접속을 받지 않는다) 다음 주 실행이 메운다.
# 한 기관이라도 실패하면 나머지를 보낸 뒤 실패로 끝난다(시도교육청 계획은 연 1회, 지정 번호 19-N으로 올라간다). 예약 실행은 기본 브랜치(main)에 있을 때만 동작한다.
# 수집기 코드를 고칠 때는 dry-run 워크플로가 돈다(시트에 보내지 않음). 실제 전송을 바로 해보려면 이 파일을 고쳐 push한다.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collect.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python -m harvest.collect --send --classify
