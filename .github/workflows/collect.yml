name: collect

# 새 글을 분류해 승인 시트로 보낸다. 시트가 중복을 거르고 이미 있는 글은 다시 분류하지 않으므로 여러 번 돌아도 새 글만 추가된다.
# 매주 월 06:00 KST(일 21:00 UTC). 예약 실행은 기본 브랜치(main)에 있을 때만 동작한다.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "harvest/sources/**"
      - "harvest/collect.py"
      - "harvest/classify.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python -m harvest.collect --send --classify
