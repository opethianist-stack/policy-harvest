name: collect

# 지금은 드라이런만 한다: 새 글 5건만 분류해 로그로 출력. 확인이 끝나면 주간 예약 실행과 --send 로 바꾼다.
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/sources/**"
      - "harvest/collect.py"
      - "harvest/classify.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect (dry run)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python -m harvest.collect --dry-run --classify --limit 5
