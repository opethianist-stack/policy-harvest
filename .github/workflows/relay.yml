name: relay

# Apps Script(구글 서버)가 받을 수 없는 첨부(과기정통부)를 러너가 대신 받아 시트 웹 앱의 중계 폴더에 넣는다.
# 매일 00:30 KST(15:30 UTC). 01:00 deliverApproved가 중계 폴더의 파일로 저장한다. 승인한 과기정통부 행을 바로 넣고 싶으면
# Actions에서 이 워크플로를 수동 실행한 뒤 시트 메뉴 "승인 행 지금 보내기"를 누른다. 예약 실행은 기본 브랜치(main)에 있을 때만 동작한다
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Relay files Apps Script cannot download
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python -m harvest.relay
