name: dry-run

# 수집기를 고치면 시트에 보내지 않고 수집 결과만 출력한다(시트 중복 확인도 하지 않아 기간 안의 글이 모두 나온다). peek는 새 수집기를 만들 때 페이지 구조를 보는 용도
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/**"
      - "scripts/peek.py"
      - "config/sources.yaml"
      - ".github/workflows/dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 웹 게시판 수집기만 돌린다. 과기정통부 API(공공데이터포털)는 해외 러너 접속이 자주 끊겨 여기서는 빼고 collect 워크플로에서 확인한다
      - name: Collect (dry run, web boards, last 90 days)
        run: |
          python -m harvest.collect --dry-run --only NIPA --since-days 90
          python -m harvest.collect --dry-run --only KOSAC --since-days 90
          python -m harvest.collect --dry-run --only NIA --since-days 30
          python -m harvest.collect --dry-run --only KERIS --since-days 30
      - name: Education offices (plan of this year, download check)
        run: |
          python -m harvest.collect --dry-run --only EDU --probe-files
      - name: Peek ministries (detail 2)
        if: always()
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          UA = {"User-Agent": "policy-harvest/0.1 (+https://github.com/opethianist-stack/policy-harvest)"}
          r = requests.get("https://www.moe.go.kr/boardCnts/listRenew.do?boardID=294&m=020402&s=moe", headers=UA, timeout=60)
          s = BeautifulSoup(r.text, "html.parser")
          tr = s.find("table").find_all("tr")[1]
          print("MOE row", str(tr)[:1500])
          i = r.text.find("function goView"); print("MOE goView", r.text[i:i+600] if i >= 0 else None)
          for m in re.finditer(r"function (\w+)\s*\(([^)]*)\)\s*\{[^}]{0,300}viewRenew", r.text):
              print("MOE fn", r.text[m.start():m.start()+500])
          print("MOE paging", re.findall(r"(?:currPage|pageIndex|page)=\d+", r.text)[:5], re.findall(r"goPage\([^)]*\)|fnPage\([^)]*\)|linkPage\([^)]*\)", r.text)[:3])
          r = requests.get("https://www.moel.go.kr/news/enews/report/enewsList.do", headers=UA, timeout=60)
          print("MOEL paging", re.findall(r"(?:pageIndex|page|curPage)=\d+", r.text)[:5], re.findall(r"\w*[Pp]age\w*\(\s*'?\d+'?\s*\)", r.text)[:5])
          d = requests.get("https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=20008", headers=UA, timeout=60).text
          ds = BeautifulSoup(d, "html.parser")
          for c in ds.find_all(["div", "td"], class_=True):
              t = " ".join(c.get_text(" ", strip=True).split())
              if "상하이" in t and len(t) < 4000:
                  print("MOEL body cand", c.name, c.get("class"), t[:120])
          for cd in ("000011", "000012", "000010"):
              j = requests.get(f"https://www.aikorea.go.kr/web/board/brdList.do?menu_cd={cd}", headers=UA, timeout=60).json()
              print(cd, "boardAttUrl", j.get("boardAttUrl"), "paging", j.get("pagingInfoVO"))
              for it in j["brdList"][:4]:
                  print("  ", it["num"], it["menu_id"], it.get("write_dt"), it.get("disp_write_dt"), it["title"][:50], "|", it.get("att_file"), it.get("file_org"), it.get("file_save"), it.get("subpath"), it.get("pdf_file"), it.get("link"))
          for u in ("https://www.aikorea.go.kr/web/board/brdDetail.do?menu_cd=000011&num=819",
                    "https://www.aikorea.go.kr/web/board/brdView.do?menu_cd=000011&num=819"):
              r = requests.get(u, headers=UA, timeout=60)
              print("DETAIL", u, r.status_code, r.headers.get("content-type"), len(r.text))
              try:
                  j = r.json(); print("  keys", list(j)[:30])
                  for k, v in j.items():
                      if isinstance(v, list) and v and isinstance(v[0], dict) and any("file" in x.lower() for x in v[0]):
                          print("  list", k, v[:3])
              except Exception:
                  print("  text", r.text[:300])
          PY
      - name: Peek ministries (detail)
        if: always()
        run: |
          python scripts/peek.py "https://www.moe.go.kr/boardCnts/listRenew.do?boardID=294&m=020402&s=moe" --follow "boardSeq=|viewRenew" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/news/enews/report/enewsList.do" --follow "enewsView|bbs_seq=" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/policy/policydata/list.do" --follow "view\\.do" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/policy/busireport/main.do" --grep "busireport|[Dd]own|20[0-9][0-9]\\.[0-9][0-9]\\.[0-9][0-9]" | cut -c1-400 | head -20 || true
          python - <<'PY'
          import json, re, requests
          UA = {"User-Agent": "policy-harvest/0.1 (+https://github.com/opethianist-stack/policy-harvest)"}
          h = requests.get("https://www.aikorea.go.kr/", headers=UA, timeout=30)
          print("HOME", h.status_code, h.headers.get("content-type"), len(h.text))
          for m in re.finditer(r'"menu_(?:cd|nm|name|url)"\s*:\s*"([^"]*)"', h.text):
              pass
          names = re.findall(r'\{[^{}]*?"menu_cd"\s*:\s*"(\d+)"[^{}]*?\}', h.text)
          for obj in re.findall(r'\{[^{}]*?"menu_cd"[^{}]*?\}', h.text)[:80]:
              cd = re.search(r'"menu_cd"\s*:\s*"([^"]*)"', obj)
              nm = re.search(r'"menu_(?:nm|name|title)"\s*:\s*"([^"]*)"', obj)
              url = re.search(r'"(?:menu_url|url|link)"\s*:\s*"([^"]*)"', obj)
              print("MENU", cd and cd.group(1), nm and nm.group(1), url and url.group(1))
          if "MENU" not in h.text[:0]:
              print("HOME head", h.text[:1500])
          for cd in ("000011", "000014"):
              r = requests.get(f"https://www.aikorea.go.kr/web/board/brdList.do?menu_cd={cd}", headers=UA, timeout=60)
              try:
                  d = r.json()
              except Exception as e:
                  print(cd, "not json", e); continue
              print(cd, "keys", list(d)[:20])
              lst = d.get("brdList") or []
              print(cd, "n", len(lst), "item keys", list(lst[0])[:60] if lst else None)
              for it in lst[:6]:
                  print("  ", it.get("num"), it.get("menu_id"), it.get("regdate") or it.get("reg_date"), (it.get("title") or "")[:60],
                        {k: v for k, v in it.items() if "file" in k.lower() and v})
          PY
