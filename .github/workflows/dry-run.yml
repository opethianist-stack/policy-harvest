name: dry-run

# 수집기를 고치면 시트에 보내지 않고 수집 결과만 출력한다(시트 중복 확인도 하지 않아 기간 안의 글이 모두 나온다). peek는 새 수집기를 만들 때 페이지 구조를 보는 용도
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/**"
      - "scripts/peek.py"
      - "config/sources.yaml"
      - ".github/workflows/dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 웹 게시판 수집기만 돌린다. 과기정통부 API(공공데이터포털)는 해외 러너 접속이 자주 끊겨 여기서는 빼고 collect 워크플로에서 확인한다
      - name: Collect (dry run, web boards, last 90 days)
        run: |
          python -m harvest.collect --dry-run --only NIPA --since-days 90
          python -m harvest.collect --dry-run --only KOSAC --since-days 90
      - name: Education offices (plan of this year, download check)
        run: |
          python -m harvest.collect --dry-run --only EDU --probe-files
          python - <<'PY'
          import requests
          BR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "ko-KR,ko;q=0.9"}
          tests = [
            ("PEN", "https://www.pen.go.kr/main/cm/cntnts/cntntsView.do?mi=31848&cntntsId=290",
                    "https://www.pen.go.kr/main/cf/fileDownload.do?fileKey=af38edbc916197d4c2ea12d661fa4f08"),
            ("PEN-img", "https://www.pen.go.kr/main/cm/cntnts/cntntsView.do?mi=31848&cntntsId=290",
                    "https://www.pen.go.kr/main/cf/fileDownload.do?fileKey=074a9943e38816a81ac9ba54718014a1"),
            ("GWE", "https://www.gwe.go.kr/main/content.do?key=m2307211210954",
                    "https://www.gwe.go.kr/cmm/fileDown.do?encKey=MTEyMzE4&type=fileMng"),
            ("GWE-preview", "https://www.gwe.go.kr/main/content.do?key=m2307211210954",
                    "https://www.gwe.go.kr/cmm/preview.do?encKey=MTEyMzE4&type=fileMng"),
          ]
          for name, page, f in tests:
              for label, sess_first, hdr in (("plain-browser", False, BR), ("session-browser", True, BR)):
                  s = requests.Session(); s.headers.update(hdr)
                  if sess_first:
                      s.get(page, timeout=60)
                  try:
                      r = s.get(f, headers={"Referer": page}, timeout=90)
                      print(name, label, r.status_code, r.headers.get("content-type"), r.headers.get("content-disposition"), len(r.content), r.content[:8])
                  except Exception as e:
                      print(name, label, "ERR", e)
          PY
