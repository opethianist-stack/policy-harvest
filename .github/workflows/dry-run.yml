name: dry-run

# 수집기를 고치면 시트에 보내지 않고 수집 결과만 출력한다(시트 중복 확인도 하지 않아 기간 안의 글이 모두 나온다). peek는 새 수집기를 만들 때 페이지 구조를 보는 용도
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/**"
      - "scripts/peek.py"
      - "config/sources.yaml"
      - ".github/workflows/dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 웹 게시판 수집기만 돌린다. 과기정통부 API(공공데이터포털)는 해외 러너 접속이 자주 끊겨 여기서는 빼고 collect 워크플로에서 확인한다
      - name: Collect (dry run, web boards, last 90 days)
        run: |
          python -m harvest.collect --dry-run --only NIPA --since-days 90
          python -m harvest.collect --dry-run --only KOSAC --since-days 90
          python -m harvest.collect --dry-run --only NIA --since-days 30
          python -m harvest.collect --dry-run --only KERIS --since-days 30
      - name: Education offices (plan of this year, download check)
        run: |
          python -m harvest.collect --dry-run --only EDU --probe-files
      - name: Peek ministries (detail)
        if: always()
        run: |
          python scripts/peek.py "https://www.moe.go.kr/boardCnts/listRenew.do?boardID=294&m=020402&s=moe" --follow "boardSeq=|viewRenew" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/news/enews/report/enewsList.do" --follow "enewsView|bbs_seq=" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/policy/policydata/list.do" --follow "view\\.do" | cut -c1-300 | head -60 || true
          python scripts/peek.py "https://www.moel.go.kr/policy/busireport/main.do" --grep "busireport|[Dd]own|20[0-9][0-9]\\.[0-9][0-9]\\.[0-9][0-9]" | cut -c1-400 | head -20 || true
          python - <<'PY'
          import json, re, requests
          UA = {"User-Agent": "policy-harvest/0.1 (+https://github.com/opethianist-stack/policy-harvest)"}
          h = requests.get("https://www.aikorea.go.kr/", headers=UA, timeout=30)
          print("HOME", h.status_code, h.headers.get("content-type"), len(h.text))
          for m in re.finditer(r'"menu_(?:cd|nm|name|url)"\s*:\s*"([^"]*)"', h.text):
              pass
          names = re.findall(r'\{[^{}]*?"menu_cd"\s*:\s*"(\d+)"[^{}]*?\}', h.text)
          for obj in re.findall(r'\{[^{}]*?"menu_cd"[^{}]*?\}', h.text)[:80]:
              cd = re.search(r'"menu_cd"\s*:\s*"([^"]*)"', obj)
              nm = re.search(r'"menu_(?:nm|name|title)"\s*:\s*"([^"]*)"', obj)
              url = re.search(r'"(?:menu_url|url|link)"\s*:\s*"([^"]*)"', obj)
              print("MENU", cd and cd.group(1), nm and nm.group(1), url and url.group(1))
          if "MENU" not in h.text[:0]:
              print("HOME head", h.text[:1500])
          for cd in ("000011", "000014"):
              r = requests.get(f"https://www.aikorea.go.kr/web/board/brdList.do?menu_cd={cd}", headers=UA, timeout=60)
              try:
                  d = r.json()
              except Exception as e:
                  print(cd, "not json", e); continue
              print(cd, "keys", list(d)[:20])
              lst = d.get("brdList") or []
              print(cd, "n", len(lst), "item keys", list(lst[0])[:60] if lst else None)
              for it in lst[:6]:
                  print("  ", it.get("num"), it.get("menu_id"), it.get("regdate") or it.get("reg_date"), (it.get("title") or "")[:60],
                        {k: v for k, v in it.items() if "file" in k.lower() and v})
          PY
