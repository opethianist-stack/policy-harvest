name: dry-run

# 수집기를 고치면 시트에 보내지 않고 수집 결과만 출력한다(시트 중복 확인도 하지 않아 기간 안의 글이 모두 나온다). peek는 새 수집기를 만들 때 페이지 구조를 보는 용도
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/**"
      - "scripts/peek.py"
      - "config/sources.yaml"
      - ".github/workflows/dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 웹 게시판 수집기만 돌린다. 과기정통부 API(공공데이터포털)는 해외 러너 접속이 자주 끊겨 여기서는 빼고 collect 워크플로에서 확인한다
      - name: Collect (dry run, web boards, last 90 days)
        run: |
          python -m harvest.collect --dry-run --only NIPA --since-days 90
          python -m harvest.collect --dry-run --only KOSAC --since-days 90
      - name: Peek education offices
        run: |
          G='[Dd]own|[Ff]ile|atch|\.(pdf|hwpx?)\b'
          for u in \
            "https://www.pen.go.kr/main/cm/cntnts/cntntsView.do?mi=31848&cntntsId=290" \
            "https://www.ice.go.kr/ice/na/ntt/selectNttList.do?mi=11738&bbsId=1817" \
            "https://use.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1940&q_bbsDocNo=20251218112017796" \
            "https://www.gwe.go.kr/main/content.do?key=m2307211210954" \
            "https://www.cbe.go.kr/cbe/cm/cntnts/cntntsView.do?mi=11737&cntntsId=35634" \
            "https://www.jbe.go.kr/index.jbe?menuCd=DOM_000000107003002000" \
            "https://www.gbe.kr/main/cm/cntnts/cntntsView.do?mi=4147&cntntsId=9394" \
            "https://www.gne.go.kr/user/bbs/BD_selectBbsList.do?q_bbsSn=1561"; do
            python scripts/peek.py "$u" --grep "$G" | cut -c1-600 | head -60 || true
          done
          curl -sS -m 60 -o /dev/null -w "GOE pdf %{http_code} %{content_type} %{size_download}\n" "https://www.goe.go.kr/resource/goe/na/bbs_1995/2025/12/948f7aa5-e611-4b07-8dd7-cf096ca0c682.pdf" || true
