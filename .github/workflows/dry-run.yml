name: dry-run

# 수집기를 고치면 시트에 보내지 않고 수집 결과만 출력한다. peek는 새 수집기를 만들 때 페이지 구조를 보는 용도
on:
  workflow_dispatch:
  push:
    paths:
      - "harvest/**"
      - "scripts/peek.py"
      - "config/sources.yaml"
      - ".github/workflows/dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Peek
        run: |
          python scripts/peek.py "https://www.kosac.re.kr/menus/272/boards/394/posts/61990" --grep '첨부|[Dd]ownload|attach|[Ff]ile(Id|Name|Sn|No)|\.(hwpx?|pdf|zip)\b'
          python scripts/peek.py "https://www.kosac.re.kr/menus/272/boards/394/posts" --grep 'board_list|ico_file|첨부' 
      - name: Collect (dry run)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python -m harvest.collect --dry-run
