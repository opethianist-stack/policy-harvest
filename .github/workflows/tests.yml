name: tests

on:
  push:
    paths:
      - "harvest/**"
      - "apps-script/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q tests
      - name: Apps Script tests
        run: node --test tests/apps_script.test.mjs
