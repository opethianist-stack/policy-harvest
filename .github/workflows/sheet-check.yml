name: sheet-check
# 승인 시트 연결 확인: 시험 행 1개를 두 번 보낸다(두 번째는 중복으로 건너뛰어야 한다)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sheet_check.py"
      - "harvest/sheet.py"
      - ".github/workflows/sheet-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send test row
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python scripts/sheet_check.py
