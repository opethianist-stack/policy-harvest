name: backfill

# 한 번만 쓰는 워크플로: NIA 공지사항 고정 글 2건(인공지능 전환 추진 전략, AI기본법 하위법령)을 분류해 승인 시트로 보낸다. 끝나면 지운다
on:
  push:
    paths:
      - ".github/workflows/backfill.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send NIA pinned notices
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python scripts/send_posts.py NIA notice 28771 28987
