name: backfill

# 한 번만 쓰는 워크플로: NIA·KERIS 보도자료·공지사항 최근 90일을 분류해 승인 시트로 보낸다. 끝나면 지운다
on:
  push:
    paths:
      - ".github/workflows/backfill.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill NIA, KERIS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: |
          python -m harvest.collect --send --classify --only NIA --since-days 90
          python -m harvest.collect --send --classify --only KERIS --since-days 90
