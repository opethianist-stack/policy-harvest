# 수집 대상 기관 설정
# 정책문서만 수집한다. 입찰·사업공고는 Policy Fit에서 다룬다(docs/handoff-policy-fit.md).
# category: 파일명의 "분류" 값(부처 / 공공기관)
# file_org: 파일명의 "기관" 값. Policy Fit data/org-rules.json 의 별칭과 맞아야 한다
# boards: 게시판 목록. kind는 press(보도자료) policy(정책자료) notice(공지사항) disclosure(경영공시·경영목표·사업계획)
#   source: user(담당자 확인) / probe(사전 조사에서 찾음) / search(웹 검색 결과에서 찾음)
#   비어 있으면 probe가 홈페이지 메뉴에서 후보를 찾는다.
# ministry: 주무부처. KEDI는 국무조정실 경제·인문사회연구회 소관이다(교육 분야 연구기관).

agencies:
  # ── 부처 ──
  - id: MSIT
    name: 과학기술정보통신부
    category: 부처
    file_org: 과기정통부
    home: https://www.msit.go.kr
    # 게시판 대신 공공데이터포털 API(DATA_GO_KR_KEY)로 받는다. 한 페이지 최대 10건, 키워드 검색 없음.
    # 첨부는 대부분 hwpx+odt 쌍. Policy Fit 색인은 odt를 읽지 않으므로 hwpx를 보낸다.
    api:
      - {kind: press, url: "https://apis.data.go.kr/1721000/msitpressreleaseinfo/pressReleaseList"}
      - {kind: policy, url: "https://apis.data.go.kr/1721000/msitmainpolicyinfo/mainPolicyList"}
    # 메뉴는 JS(fn_menulast_go)로 연다. 아래는 메뉴 인자(mPid, mId)로 만든 주소
    boards:
      - {kind: press, source: probe, url: "https://www.msit.go.kr/bbs/list.do?sCode=user&mPid=208&mId=307"}
      - {kind: policy, source: probe, url: "https://www.msit.go.kr/contents/cont.do?sCode=user&mPid=80&mId=336"}
      # 소관기관 업무계획: 산하기관 업무계획이 모여 있을 수 있다(메뉴 인자로 만든 주소, 확인 필요)
      - {kind: policy, source: probe, url: "https://www.msit.go.kr/bbs/list.do?sCode=user&mPid=75&mId=337"}
  - id: MOE
    name: 교육부
    category: 부처
    file_org: 교육부
    home: https://www.moe.go.kr
    # 오픈API 없음. 사이트 게시판을 읽는다
    boards:
      - {kind: press, source: probe, url: "https://www.moe.go.kr/boardCnts/listRenew.do?boardID=294&m=020402&s=moe"}
      - {kind: policy, source: probe, url: "https://www.moe.go.kr/sub/infoRenew.do?page=72762&m=031101&s=moe"}      # 올해 업무계획(첨부 4)
      - {kind: policy, source: probe, url: "https://www.moe.go.kr/boardCnts/listRenew.do?boardID=72713&renew=72713&m=031102&s=moe"}  # 2025년 이전 주요업무계획
  - id: MOEL
    name: 고용노동부
    category: 부처
    file_org: 고용노동부
    home: https://www.moel.go.kr
    boards:
      - {kind: press, source: search, url: "https://www.moel.go.kr/news/enews/report/enewsList.do"}
      - {kind: policy, source: search, url: "https://www.moel.go.kr/policy/policydata/list.do"}   # 정책자료실(업무계획·업무보고 원문)
      - {kind: policy, source: search, url: "https://www.moel.go.kr/policy/busireport/main.do"}  # 업무보고
  - id: NAISC
    name: 국가인공지능전략위원회
    category: 부처
    file_org: 국가AI전략위   # Policy Fit 별칭 등록됨
    home: https://www.aikorea.go.kr/web/main.do
    # 게시판은 menu_cd로 구분. 000011에 인공지능 행동계획 원문이 올라와 있다(검색 결과로 확인)
    boards:
      - {kind: press, source: search, url: "https://www.aikorea.go.kr/web/board/brdList.do?menu_cd=000018"}
      - {kind: policy, source: search, url: "https://www.aikorea.go.kr/web/board/brdList.do?menu_cd=000011"}
      - {kind: policy, source: search, url: "https://www.aikorea.go.kr/web/board/brdList.do?menu_cd=000014"}  # 정책 보고서

  # ── 공공기관 ──
  - id: NIPA
    category: 공공기관
    file_org: NIPA
    name: 정보통신산업진흥원
    ministry: 과학기술정보통신부
    home: https://www.nipa.kr
    boards:
      - {kind: press, source: probe, url: "https://www.nipa.kr/home/4-4-1"}
      - {kind: disclosure, source: probe, url: "https://www.nipa.kr/home/3-2"}
  - id: NIA
    category: 공공기관
    file_org: NIA
    name: 한국지능정보사회진흥원
    ministry: 과학기술정보통신부
    home: https://www.nia.or.kr
    boards:
      - {kind: press, source: user, url: "https://www.nia.or.kr/site/nia_kor/ex/bbs/List.do?cbIdx=90549"}
      # 업무계획은 별도 공시 없이 공지사항에 올라온다. 공지 전체를 받고 분류에서 정책문서만 남긴다.
      - {kind: notice, source: user, url: "https://www.nia.or.kr/site/nia_kor/ex/bbs/List.do?cbIdx=99835"}
  - id: KERIS
    category: 공공기관
    file_org: KERIS
    name: 한국교육학술정보원
    ministry: 교육부
    home: https://www.keris.or.kr
    boards:
      - {kind: press, source: user, url: "https://www.keris.or.kr/main/na/ntt/selectNttList.do?mi=1088&bbsId=1090"}
      # 업무계획은 별도 공시 없이 공지사항에 올라온다. 공지 전체를 받고 분류에서 정책문서만 남긴다.
      - {kind: notice, source: user, url: "https://www.keris.or.kr/main/na/ntt/selectNttList.do?mi=1051&bbsId=1088"}
  - id: KOSAC
    category: 공공기관
    file_org: KOSAC
    name: 한국과학창의재단
    former_ids: [KOFAC]  # 2025년 명칭 변경 전 약칭. 과거 문서·알리오 자료에 남아 있을 수 있다.
    ministry: 과학기술정보통신부
    home: https://www.kosac.re.kr/main
    boards:
      - {kind: press, source: probe, url: "https://www.kosac.re.kr/menus/272/boards/394/posts"}
      - {kind: disclosure, source: probe, url: "https://www.kosac.re.kr/menus/331/contents/331"}
      - {kind: disclosure, source: probe, url: "https://www.kosac.re.kr/menus/208/contents/208"}
  - id: KEDI
    category: 공공기관
    file_org: KEDI
    name: 한국교육개발원
    ministry: 국무조정실(경제·인문사회연구회)
    home: https://www.kedi.re.kr
    boards:
      - {kind: press, source: probe, url: "https://www.kedi.re.kr/khome/mobile2/announce/listBroadAnnounceForm.do"}
      - {kind: disclosure, source: probe, url: "https://www.kedi.re.kr/khome/mobile2/intro/managementgoal.do"}
      - {kind: disclosure, source: probe, url: "https://www.kedi.re.kr/khome/mobile2/intro/businessplan.do"}

# 기관 사이트 외 수집 경로 후보
aggregators:
  - id: ALIO
    name: 공공기관 경영정보 공개시스템
    home: https://www.alio.go.kr
    # 경영공시 원문(사업계획·경영목표)은 API가 없어 웹 화면으로 확인해야 한다.

# 알리오플러스 Open API (Policy Fit에서 쓰는 것과 같은 키, API마다 키가 따로 있다)
#   호스트 http://openapi.alioplus.go.kr (HTTPS 미지원), POST form, 인증은 폼 필드 X-API-AUTH-KEY, pageSize 필수
#   /api/apba     기관정보 (ALIO_APBA_KEY)      기관유형 08=연구교육, 응답에 주요사업 목록(bsnMstList)
#   /api/business 사업정보 (ALIO_BIZ_KEY)       기관별 사업 소개·대상·기간. 공고 게시판이 아니다
#   /api/event    행사정보 (ALIO_EVENT_KEY)
#   /api/facility 시설정보 (ALIO_FACILITY_KEY)  수집 대상 아님
# 정책브리핑(korea.kr): RSS 서비스 중단(2026-09-26 확인), data.go.kr에도 대체 API가 없어 수집 경로에서 제외한다.

# 홈페이지 메뉴에서 게시판 후보를 찾을 때 쓰는 링크 텍스트
board_keywords:
  press: [보도자료, 언론보도]
  policy: [정책자료, 업무계획, 주요정책, 정책브리핑]
  disclosure: [경영공시, 경영정보, 사업계획, 경영목표, 정보공개]
